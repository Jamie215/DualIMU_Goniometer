<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="4" fill="#555"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>

  <!-- leg (side view, facing right) -->
  <g stroke-linecap="round" fill="none">
    <line x1="352" y1="0" x2="360" y2="120" stroke="#BFA88F" stroke-width="124"/>
    <line x1="360" y1="120" x2="400" y2="370" stroke="#BFA88F" stroke-width="100"/>
    <line x1="400" y1="370" x2="340" y2="600" stroke="#BFA88F" stroke-width="74"/>
    <line x1="360" y1="120" x2="400" y2="370" stroke="#EEDFCF" stroke-width="96"/>
    <line x1="400" y1="370" x2="340" y2="600" stroke="#EEDFCF" stroke-width="70"/>
    <line x1="352" y1="0" x2="360" y2="120" stroke="#EEDFCF" stroke-width="120"/>
  </g>
  <path d="M312,592 L372,588 L470,618 Q482,640 460,644 L318,644 Q300,630 312,592 Z" fill="#EEDFCF" stroke="#BFA88F" stroke-width="2"/>
  <rect x="270" y="0" width="180" height="70" fill="url(#fade)"/>

  <!-- thigh board (central) with strap; USB end toward hip -->
  <g transform="translate(378,232) rotate(-9.1)">
    <rect x="-58" y="-10" width="116" height="20" rx="5" fill="#5A5A5A" opacity="0.55"/>
    <rect x="-21" y="-42" width="42" height="84" rx="6" fill="#2E75B6" stroke="#1F4E79" stroke-width="2"/>
    <rect x="-7" y="-50" width="14" height="10" fill="#7F7F7F"/>
    <text x="0" y="6" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">C</text>
  </g>
  <!-- shank board (peripheral) -->
  <g transform="translate(376,462) rotate(14.6)">
    <rect x="-47" y="-10" width="94" height="20" rx="5" fill="#5A5A5A" opacity="0.55"/>
    <rect x="-21" y="-42" width="42" height="84" rx="6" fill="#ED7D31" stroke="#C55A11" stroke-width="2"/>
    <rect x="-7" y="-50" width="14" height="10" fill="#7F7F7F"/>
    <text x="0" y="6" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">P</text>
  </g>

  <!-- inter-board wires -->
  <path d="M384,273 C440,320 452,400 400,448" fill="none" stroke="#333" stroke-width="4"/>
  <path d="M384,273 C440,320 452,400 400,448" fill="none" stroke="#FFC000" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- USB cables -->
  <path d="M370,183 C380,110 640,70 902,212" fill="none" stroke="#404040" stroke-width="4"/>
  <path d="M388,414 C440,360 720,480 908,538" fill="none" stroke="#404040" stroke-width="4"/>
  <text x="640" y="104" font-size="18" fill="#404040" text-anchor="middle">USB cable: data and power</text>
  <text x="720" y="540" font-size="18" fill="#404040" text-anchor="middle">USB cable: power only</text>

  <!-- PC -->
  <rect x="920" y="110" width="230" height="150" rx="8" fill="#F2F2F2" stroke="#404040" stroke-width="3"/>
  <rect x="934" y="124" width="202" height="122" fill="#fff" stroke="#BFBFBF"/>
  <rect x="934" y="124" width="202" height="20" fill="#2E7D32"/>
  <text x="1035" y="139" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">RUNNING</text>
  <polyline points="944,230 964,226 980,200 996,170 1012,160 1028,172 1044,206 1060,226 1076,228 1092,204 1108,168 1124,160" fill="none" stroke="#1565C0" stroke-width="2.5"/>
  <path d="M900,262 L1170,262 L1190,282 L880,282 Z" fill="#D9D9D9" stroke="#404040" stroke-width="3"/>
  <text x="1035" y="312" font-size="20" font-weight="bold" fill="#0B0B0B" text-anchor="middle">PC: KneeGoniometerGUI.exe</text>
  <text x="1035" y="336" font-size="17" fill="#404040" text-anchor="middle">calibration · knee angle · live plot · CSV</text>

  <!-- power -->
  <rect x="910" y="510" width="130" height="62" rx="10" fill="#A6A6A6" stroke="#595959" stroke-width="3"/>
  <rect x="924" y="530" width="60" height="22" rx="3" fill="#E2EFDA" stroke="#595959"/>
  <text x="975" y="600" font-size="20" font-weight="bold" fill="#0B0B0B" text-anchor="middle">USB power</text>
  <text x="975" y="624" font-size="17" fill="#404040" text-anchor="middle">charger, power bank or a 2nd PC port</text>

  <!-- labels -->
  <g font-size="19" fill="#0B0B0B" text-anchor="end">
    <line x1="290" y1="226" x2="352" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#dot)"/>
    <text x="282" y="214" font-weight="bold" fill="#1F4E79">Thigh board: CENTRAL</text>
    <text x="282" y="238" font-size="16" fill="#404040">IMU + filter; merges both boards</text>
    <text x="282" y="258" font-size="16" fill="#404040">and sends one line per sample</text>

    <line x1="290" y1="466" x2="354" y2="462" stroke="#555" stroke-width="1.5" marker-end="url(#dot)"/>
    <text x="282" y="454" font-weight="bold" fill="#C55A11">Shank board: PERIPHERAL</text>
    <text x="282" y="478" font-size="16" fill="#404040">IMU + filter; streams its</text>
    <text x="282" y="498" font-size="16" fill="#404040">orientation to the central</text>

    <line x1="290" y1="336" x2="318" y2="245" stroke="#555" stroke-width="1.5" marker-end="url(#dot)"/>
    <text x="282" y="350" font-size="16" fill="#404040">elastic strap</text>
  </g>
  <g font-size="16" fill="#404040">
    <line x1="490" y1="356" x2="440" y2="362" stroke="#555" stroke-width="1.5" marker-end="url(#dot)"/>
    <text x="498" y="352" font-size="19" font-weight="bold" fill="#0B0B0B">3 soldered wires</text>
    <text x="498" y="374">2 × UART (TX→RX each way) + GND</text>
    <text x="498" y="394">cross the knee</text>
    <text x="200" y="40" font-size="16" fill="#7F7F7F" text-anchor="middle">hip</text>
    <text x="520" y="660" font-size="16" fill="#7F7F7F" text-anchor="middle">anterior →</text>
  </g>
</svg>
