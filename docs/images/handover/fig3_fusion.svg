<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#404040"/>
    </marker>
  </defs>
  <rect width="1500" height="760" fill="#fff"/>

  <!-- sensors -->
  <rect x="30" y="40" width="370" height="150" rx="12" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2.5"/>
  <text x="52" y="84" font-size="29" font-weight="bold" fill="#0B0B0B">Gyroscope</text>
  <text x="52" y="122" font-size="24" fill="#0B0B0B">How fast the board turns:</text>
  <text x="52" y="154" font-size="24" fill="#0B0B0B">smooth, but errors add up</text>

  <rect x="30" y="360" width="370" height="150" rx="12" fill="#FBE5D6" stroke="#C55A11" stroke-width="2.5"/>
  <text x="52" y="404" font-size="29" font-weight="bold" fill="#0B0B0B">Accelerometer</text>
  <text x="52" y="442" font-size="24" fill="#0B0B0B">Which way is down: steady,</text>
  <text x="52" y="474" font-size="24" fill="#0B0B0B">but upset by fast movement</text>

  <!-- filter frame -->
  <rect x="610" y="20" width="560" height="510" rx="16" fill="#F4F9F0" stroke="#548235" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="890" y="508" font-size="22" fill="#548235" text-anchor="middle" font-weight="bold">Mahony filter (repeats for every reading)</text>

  <!-- step 1 -->
  <rect x="650" y="50" width="480" height="130" rx="12" fill="#E2EFDA" stroke="#548235" stroke-width="2.5"/>
  <text x="674" y="94" font-size="27" font-weight="bold" fill="#0B0B0B">1. Follow the rotation</text>
  <text x="674" y="132" font-size="24" fill="#0B0B0B">Turn the orientation estimate by</text>
  <text x="674" y="162" font-size="24" fill="#0B0B0B">the rotation just measured</text>

  <!-- step 2 -->
  <rect x="650" y="350" width="480" height="130" rx="12" fill="#E2EFDA" stroke="#548235" stroke-width="2.5"/>
  <text x="674" y="394" font-size="27" font-weight="bold" fill="#0B0B0B">2. Compare</text>
  <text x="674" y="432" font-size="24" fill="#0B0B0B">Predicted "down" vs the "down"</text>
  <text x="674" y="462" font-size="24" fill="#0B0B0B">the accelerometer measures</text>

  <!-- step 3: correction arrow up -->
  <line x1="770" y1="350" x2="770" y2="186" stroke="#548235" stroke-width="4" marker-end="url(#ah)"/>
  <text x="792" y="248" font-size="27" font-weight="bold" fill="#0B0B0B">3. Correct</text>
  <text x="792" y="282" font-size="22" fill="#0B0B0B">nudge toward the measured "down"</text>
  <text x="792" y="310" font-size="22" fill="#0B0B0B">(part now, part built up over time)</text>

  <!-- inputs -->
  <line x1="400" y1="115" x2="644" y2="115" stroke="#404040" stroke-width="3.5" marker-end="url(#ah)"/>
  <rect x="428" y="88" width="180" height="54" rx="27" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
  <text x="518" y="123" font-size="23" fill="#0B0B0B" text-anchor="middle">− bias (§4.2)</text>

  <line x1="400" y1="435" x2="644" y2="435" stroke="#404040" stroke-width="3.5" marker-end="url(#ah)"/>
  <rect x="418" y="408" width="200" height="54" rx="27" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/>
  <text x="518" y="443" font-size="23" fill="#0B0B0B" text-anchor="middle">× trust (§4.3)</text>

  <!-- predicted down back to compare -->
  <path d="M1130,115 L1200,115" stroke="#404040" stroke-width="3.5" fill="none" marker-end="url(#ah)"/>
  <path d="M1341,250 L1341,415 L1136,415" stroke="#404040" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <text x="1356" y="320" font-size="22" fill="#404040">predicted</text>
  <text x="1356" y="348" font-size="22" fill="#404040">"down"</text>

  <!-- output -->
  <rect x="1206" y="50" width="270" height="200" rx="12" fill="#EDEDED" stroke="#404040" stroke-width="2.5"/>
  <text x="1341" y="98" font-size="28" font-weight="bold" fill="#0B0B0B" text-anchor="middle">Orientation</text>
  <text x="1341" y="140" font-size="24" fill="#0B0B0B" text-anchor="middle">→ which way gravity</text>
  <text x="1341" y="172" font-size="24" fill="#0B0B0B" text-anchor="middle">points in the board</text>
  <text x="1341" y="222" font-size="21" fill="#404040" text-anchor="middle">used for the angle (§5)</text>

  <!-- trust weight inset -->
  <text x="30" y="590" font-size="24" font-weight="bold" fill="#0B0B0B">Accelerometer trust (§4.3)</text>
  <line x1="110" y1="720" x2="560" y2="720" stroke="#595959" stroke-width="2"/>
  <line x1="110" y1="615" x2="110" y2="720" stroke="#595959" stroke-width="2"/>
  <polyline points="110,625 160,625 410,720 550,720" fill="none" stroke="#BF9000" stroke-width="4"/>
  <line x1="160" y1="625" x2="160" y2="726" stroke="#BFBFBF" stroke-dasharray="4 4"/>
  <text x="100" y="633" font-size="20" fill="#595959" text-anchor="end">full</text>
  <text x="100" y="726" font-size="20" fill="#595959" text-anchor="end">none</text>
  <text x="160" y="748" font-size="20" fill="#595959" text-anchor="middle">0.1 g</text>
  <text x="410" y="748" font-size="20" fill="#595959" text-anchor="middle">0.6 g</text>
  <text x="600" y="690" font-size="20" fill="#595959">← how far the accelerometer reading</text>
  <text x="600" y="716" font-size="20" fill="#595959">   is from normal gravity (1 g)</text>
</svg>
