<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#404040"/>
    </marker>
  </defs>
  <rect width="1440" height="520" fill="#fff"/>

  <!-- cards -->
  <g font-size="18" fill="#0B0B0B">
    <rect x="30" y="30" width="380" height="300" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
    <rect x="30" y="30" width="380" height="52" rx="10" fill="#ED7D31"/>
    <rect x="30" y="66" width="380" height="16" fill="#ED7D31"/>
    <text x="220" y="64" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">Shank board (peripheral)</text>
    <text x="54" y="118">1. Reads BMI270 accel + gyro</text>
    <text x="54" y="152">2. Fixes the library's axes (negate x)</text>
    <text x="54" y="186">3. 6-DOF Mahony filter → orientation</text>
    <text x="54" y="220">4. Sensor-fault guard drops bad samples</text>
    <text x="54" y="254">5. Sends a 30-byte packet at 50 Hz</text>
    <text x="54" y="314" font-size="16" fill="#595959">Runs only while it receives keepalives</text>

    <rect x="530" y="30" width="380" height="300" rx="10" fill="#DEEBF7" stroke="#1F4E79" stroke-width="2"/>
    <rect x="530" y="30" width="380" height="52" rx="10" fill="#2E75B6"/>
    <rect x="530" y="66" width="380" height="16" fill="#2E75B6"/>
    <text x="720" y="64" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">Thigh board (central)</text>
    <text x="554" y="118">1. Own BMI270 + axis fix + Mahony filter</text>
    <text x="554" y="152">2. Reads the shank stream; keeps the</text>
    <text x="574" y="176">newest packet with a valid checksum</text>
    <text x="554" y="210">3. Shank packet older than 30 ms → invalid</text>
    <text x="554" y="244">4. Merges thigh + shank into one text line</text>
    <text x="554" y="278">5. One write per line, fixed 50 Hz</text>
    <text x="554" y="314" font-size="16" fill="#595959">Collects only while its USB port is open</text>

    <rect x="1030" y="30" width="380" height="300" rx="10" fill="#EDEDED" stroke="#404040" stroke-width="2"/>
    <rect x="1030" y="30" width="380" height="52" rx="10" fill="#595959"/>
    <rect x="1030" y="66" width="380" height="16" fill="#595959"/>
    <text x="1220" y="64" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">PC (GUI or CLI collector)</text>
    <text x="1054" y="118">1. Forward-fills short shank gaps (≤ 10)</text>
    <text x="1054" y="152">2. Calibration: zero (2 s) + sweep (6 s)</text>
    <text x="1054" y="186">3. Knee angle = incl<tspan font-size="13" dy="4">thigh</tspan><tspan dy="-4"> − incl</tspan><tspan font-size="13" dy="4">shank</tspan></text>
    <text x="1054" y="220">4. Live plot with a phase banner</text>
    <text x="1054" y="254">5. CSV, one row per received sample,</text>
    <text x="1074" y="278">plus a diagnostics log</text>
  </g>

  <!-- links -->
  <g font-size="16" fill="#404040" text-anchor="middle">
    <line x1="414" y1="150" x2="524" y2="150" stroke="#404040" stroke-width="3" marker-end="url(#ah)"/>
    <text x="470" y="128" font-weight="bold">UART</text>
    <text x="470" y="176">shank packets</text>
    <line x1="524" y1="236" x2="414" y2="236" stroke="#404040" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah)"/>
    <text x="470" y="214">keepalive 'S'</text>
    <text x="470" y="262">every 200 ms</text>

    <line x1="914" y1="150" x2="1024" y2="150" stroke="#404040" stroke-width="3" marker-end="url(#ah)"/>
    <text x="970" y="128" font-weight="bold">USB serial</text>
    <text x="970" y="176">"D,…" lines</text>
    <line x1="1024" y1="236" x2="914" y2="236" stroke="#404040" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah)"/>
    <text x="970" y="214">port open</text>
    <text x="970" y="262">= collect</text>
  </g>

  <!-- packet -->
  <text x="30" y="398" font-size="19" font-weight="bold" fill="#0B0B0B">Shank packet (30 bytes, 50 Hz)</text>
  <g font-size="17" text-anchor="middle">
    <rect x="30" y="412" width="110" height="56" fill="#ED7D31" stroke="#fff" stroke-width="2"/>
    <text x="85" y="436" fill="#fff" font-weight="bold">0xAA</text>
    <text x="85" y="458" fill="#fff" font-size="14">header · 1 B</text>
    <rect x="140" y="412" width="420" height="56" fill="#F4B183" stroke="#fff" stroke-width="2"/>
    <text x="350" y="436" fill="#0B0B0B" font-weight="bold">quaternion w, x, y, z</text>
    <text x="350" y="458" fill="#0B0B0B" font-size="14">4 floats · 16 B</text>
    <rect x="560" y="412" width="320" height="56" fill="#F8CBAD" stroke="#fff" stroke-width="2"/>
    <text x="720" y="436" fill="#0B0B0B" font-weight="bold">raw accel x, y, z</text>
    <text x="720" y="458" fill="#0B0B0B" font-size="14">3 floats · 12 B</text>
    <rect x="880" y="412" width="110" height="56" fill="#ED7D31" stroke="#fff" stroke-width="2"/>
    <text x="935" y="436" fill="#fff" font-weight="bold">XOR</text>
    <text x="935" y="458" fill="#fff" font-size="14">checksum · 1 B</text>
  </g>
  <text x="30" y="500" font-size="16" fill="#595959">The central resyncs on the 0xAA header and drops packets whose checksum fails, so a corrupted byte costs one packet, not the stream.</text>
</svg>
