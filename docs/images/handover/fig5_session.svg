<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="430" viewBox="0 0 1720 430" font-family="Carlito, Calibri, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#404040"/></marker></defs>
  <rect width="1720" height="430" fill="#fff"/>
  <path d="M30,128 L470,128 L492,183.0 L470,238 L30,238 L30,128 Z" fill="#607D8B"/>
  <text x="261.0" y="175.0" font-size="31" font-weight="bold" fill="#fff" text-anchor="middle">Port opens · boards start</text>
  <text x="261.0" y="213.0" font-size="27" fill="#fff" text-anchor="middle">gyro bias measured: keep still</text>
  <path d="M482,128 L782,128 L804,183.0 L782,238 L482,238 L504,183.0 L482,128 Z" fill="#F9A825"/>
  <text x="643.0" y="175.0" font-size="31" font-weight="bold" fill="#0B0B0B" text-anchor="middle">ZEROING · 2 s</text>
  <text x="643.0" y="213.0" font-size="27" fill="#0B0B0B" text-anchor="middle">leg straight and still</text>
  <path d="M794,128 L1124,128 L1146,183.0 L1124,238 L794,238 L816,183.0 L794,128 Z" fill="#F9A825"/>
  <text x="970.0" y="175.0" font-size="31" font-weight="bold" fill="#0B0B0B" text-anchor="middle">SWEEP · 6 s</text>
  <text x="970.0" y="213.0" font-size="27" fill="#0B0B0B" text-anchor="middle">slowly bend knee and hip</text>
  <path d="M1136,128 L1496,128 L1518,183.0 L1496,238 L1136,238 L1158,183.0 L1136,128 Z" fill="#2E7D32"/>
  <text x="1327.0" y="175.0" font-size="31" font-weight="bold" fill="#fff" text-anchor="middle">RUNNING</text>
  <text x="1327.0" y="213.0" font-size="27" fill="#fff" text-anchor="middle">angle at 50 Hz → plot + CSV</text>
  <path d="M1508,128 L1690,128 L1690,238 L1508,238 L1530,183.0 L1508,128 Z" fill="#455A64"/>
  <text x="1610.0" y="193.0" font-size="29" fill="#fff" text-anchor="middle">idle</text>
  <rect x="140.0" y="20" width="220" height="62" rx="31" fill="#fff" stroke="#404040" stroke-width="2.5"/>
  <text x="250" y="61" font-size="29" font-weight="bold" fill="#0B0B0B" text-anchor="middle">Connect</text>
  <line x1="250" y1="78" x2="250" y2="122" stroke="#404040" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="472.0" y="20" width="320" height="62" rx="31" fill="#fff" stroke="#404040" stroke-width="2.5"/>
  <text x="632" y="61" font-size="29" font-weight="bold" fill="#0B0B0B" text-anchor="middle">Calibrate &amp; collect</text>
  <line x1="632" y1="78" x2="632" y2="122" stroke="#404040" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="1372.0" y="20" width="260" height="62" rx="31" fill="#fff" stroke="#404040" stroke-width="2.5"/>
  <text x="1502" y="61" font-size="29" font-weight="bold" fill="#0B0B0B" text-anchor="middle">Stop collecting</text>
  <line x1="1502" y1="78" x2="1502" y2="122" stroke="#404040" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="30" y="288" font-size="27" fill="#404040">Board: gyro bias removed</text>
  <text x="30" y="322" font-size="27" fill="#404040">(discarded if &gt; 3 °/s)</text>
  <text x="482" y="288" font-size="27" fill="#404040">PC: average gravity →</text>
  <text x="482" y="322" font-size="27" fill="#404040">0° axis per segment</text>
  <text x="794" y="288" font-size="27" fill="#404040">PC: tilt direction →</text>
  <text x="794" y="322" font-size="27" fill="#404040">forward axis (≥ 5° tilt)</text>
  <text x="1136" y="288" font-size="27" fill="#404040">PC: one CSV row per</text>
  <text x="1136" y="322" font-size="27" fill="#404040">received sample</text>
  <text x="1508" y="288" font-size="27" fill="#404040">Plot freezes</text>
  <text x="1508" y="322" font-size="27" fill="#404040">on the session</text>
  <line x1="482" y1="362" x2="1496" y2="362" stroke="#7F7F7F" stroke-width="2"/>
  <line x1="482" y1="352" x2="482" y2="372" stroke="#7F7F7F" stroke-width="2"/><line x1="1496" y1="352" x2="1496" y2="372" stroke="#7F7F7F" stroke-width="2"/>
  <text x="989" y="406" font-size="27" fill="#404040" text-anchor="middle">one session = one calibration = one time-stamped CSV file</text>
</svg>
