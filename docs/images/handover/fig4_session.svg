<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#404040"/>
    </marker>
  </defs>
  <rect width="1400" height="330" fill="#fff"/>
  <!-- operator actions -->
  <g font-size="17" fill="#0B0B0B" text-anchor="middle">
    <rect x="30" y="20" width="190" height="46" rx="23" fill="#fff" stroke="#404040" stroke-width="2"/>
    <text x="125" y="49" font-weight="bold">Connect</text>
    <rect x="450" y="20" width="230" height="46" rx="23" fill="#fff" stroke="#404040" stroke-width="2"/>
    <text x="565" y="49" font-weight="bold">Calibrate &amp; collect</text>
    <rect x="1180" y="20" width="190" height="46" rx="23" fill="#fff" stroke="#404040" stroke-width="2"/>
    <text x="1275" y="49" font-weight="bold">Stop collecting</text>
  </g>
  <line x1="125" y1="66" x2="125" y2="100" stroke="#404040" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="565" y1="66" x2="565" y2="100" stroke="#404040" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="1275" y1="66" x2="1275" y2="100" stroke="#404040" stroke-width="2" marker-end="url(#ah)"/>

  <!-- phases -->
  <g font-size="18" text-anchor="middle">
    <path d="M30,104 L420,104 L440,139 L420,174 L30,174 Z" fill="#607D8B"/>
    <text x="230" y="134" font-weight="bold" fill="#fff">Port opens · boards start</text>
    <text x="230" y="158" font-size="15" fill="#fff">gyro bias, up to 4 s: keep boards still</text>

    <path d="M450,104 L640,104 L660,139 L640,174 L450,174 L470,139 Z" fill="#F9A825"/>
    <text x="558" y="134" font-weight="bold" fill="#0B0B0B">ZEROING · 2 s</text>
    <text x="558" y="158" font-size="15" fill="#0B0B0B">leg straight and still</text>

    <path d="M670,104 L890,104 L910,139 L890,174 L670,174 L690,139 Z" fill="#F9A825"/>
    <text x="792" y="134" font-weight="bold" fill="#0B0B0B">SWEEP · 6 s</text>
    <text x="792" y="158" font-size="15" fill="#0B0B0B">slowly bend knee and hip</text>

    <path d="M920,104 L1250,104 L1270,139 L1250,174 L920,174 L940,139 Z" fill="#2E7D32"/>
    <text x="1095" y="134" font-weight="bold" fill="#fff">RUNNING</text>
    <text x="1095" y="158" font-size="15" fill="#fff">angle at 50 Hz → live plot + CSV</text>

    <path d="M1280,104 L1370,104 L1370,174 L1280,174 L1300,139 Z" fill="#455A64"/>
    <text x="1330" y="146" font-size="15" fill="#fff">idle</text>
  </g>

  <!-- what is fixed -->
  <g font-size="16" fill="#404040">
    <text x="30" y="210">Board: bias removed from the</text>
    <text x="30" y="230">gyro (discarded if &gt; 3 °/s)</text>
    <text x="450" y="210">PC: average gravity →</text>
    <text x="450" y="230">0° axis d<tspan font-size="12" dy="4">i</tspan><tspan dy="-4"> per segment</tspan></text>
    <text x="670" y="210">PC: in-plane tilt → forward</text>
    <text x="670" y="230">axis f<tspan font-size="12" dy="4">i</tspan><tspan dy="-4"> (segments tilting ≥ 5°)</tspan></text>
    <text x="920" y="210">PC: one CSV row per received</text>
    <text x="920" y="230">sample (valid / filled / missing)</text>
    <text x="1180" y="210">Plot freezes on</text>
    <text x="1180" y="230">the whole session</text>
  </g>
  <line x1="450" y1="260" x2="1250" y2="260" stroke="#7F7F7F" stroke-width="1.5"/>
  <line x1="450" y1="252" x2="450" y2="268" stroke="#7F7F7F" stroke-width="1.5"/>
  <line x1="1250" y1="252" x2="1250" y2="268" stroke="#7F7F7F" stroke-width="1.5"/>
  <text x="850" y="290" font-size="16" fill="#404040" text-anchor="middle">one session = one calibration = one timestamped CSV file</text>
</svg>
