name: Release Windows exe

on:
  push:
    tags: ['v*']          # e.g. v1.0.0
  workflow_dispatch:      # manual run from the Actions tab (builds only, no release)

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: python knee_gui.py --selftest          # catch broken code before packaging
      - run: pyinstaller --onefile --windowed --name KneeGoniometerGUI knee_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: KneeGoniometerGUI-windows
          path: dist/KneeGoniometerGUI.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/KneeGoniometerGUI.exe
          generate_release_notes: true
